services:
  smart-agri-tech-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-agri-tech-backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: always
    env_file:
      - ./.env
    volumes:
      - './:/smart-agri-tech'
    networks:
      - smart-agri-tech-net
    depends_on:
      - smart-agri-tech-postgres
      - smart-agri-tech-mongo
    environment:
      - WATCHFILES_FORCE_POLLING=true
    links:
      - "smart-agri-tech-postgres"
      - "smart-agri-tech-mongo"

  smart-agri-tech-postgres:
    image: postgres:latest
    container_name: smart-agri-tech-postgres
    ports:
      - "${POSTGRES_DB_EXTERNAL_PORT}:${POSTGRES_DB_INTERNAL_PORT}"
    restart: always
    env_file:
      - ./.env
    volumes:
      - smart-agri-tech-db:/var/lib/postgresql/data
    networks:
      - smart-agri-tech-net

  smart-agri-tech-pgadmin:
    container_name: smart-agri-tech-pgadmin
    image: dpage/pgadmin4
    restart: always
    env_file:
      - ./.env
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - smart-agri-tech-net
    depends_on:
      - smart-agri-tech-postgres

  smart-agri-tech-mongo:
    image: mongo:latest
    container_name: smart-agri-tech-mongo
    ports:
      - "27017:27017"  # Use default MongoDB port
    restart: always
    env_file:
      - ./.env
    volumes:
      - smart-agri-tech-mongo-db:/data/db
    networks:
      - smart-agri-tech-net
    command: ["mongod", "--bind_ip", "0.0.0.0"]  # Ensure it listens on all interfaces

volumes:
  smart-agri-tech-db:
  smart-agri-tech-mongo-db:

networks:
  smart-agri-tech-net:
    driver: bridge
    name: smart-agri-tech-net  # Explicitly name the network to avoid recreation issues
