name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      ACCESS_TOKEN: ci-access-secret
      REFRESH_TOKEN: ci-refresh-secret
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v7
      # Migration 006 needs PostGIS and pgvector, so the database is our own image rather than
      # a stock service container.
      - name: Start PostgreSQL (PostGIS + pgvector)
        run: |
          docker build -t smart-agri-tech-postgres:ci docker/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            smart-agri-tech-postgres:ci
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          docker logs postgres; exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src alembic tests main.py
      - name: Tests (unit, seeding, end-to-end API on PostgreSQL)
        run: pytest -q
        env:
          EMBEDDING_PROVIDER: hashing   # no model download in CI
      - name: Migrations match models (no autogenerate drift)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_DB: drift_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE drift_check"
          alembic upgrade head
          alembic check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build --build-arg INSTALL_ML=false -t smart-agri-tech:ci .
          docker build -t smart-agri-tech-postgres:ci docker/postgres
